<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Marina Residence</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    min-height: 100%;
    background: transparent;
    font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 16px;
  }

  .widget {
    background: #f2f3f5;
    border-radius: 999px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.14), 0 2px 6px rgba(0,0,0,0.08);
    display: flex;
    align-items: center;
    padding: 14px 14px 14px 18px;
    width: 100%;
    max-width: 920px;
    gap: 0;
    position: relative;
  }

  .dates-section {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    border: 2.5px solid #17bcd4;
    border-radius: 999px;
  }

  .date-pill {
              padding: 12px 28px;

    text-align: center;
    cursor: pointer;
    background: transparent;
    position: relative;
    min-width: 92px;
    transition: background 0.15s;
    user-select: none;
    border-radius: 999px;
  }
  .date-pill:hover,
  .date-pill.open { background: rgba(23,188,212,0.10); }

  .dp-label {
    display: block;
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #17bcd4;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .dp-month {
    display: block;
    font-size: 13px;
    font-weight: 700;
    color: #17bcd4;
    line-height: 1.3;
  }
  .dp-day {
    display: block;
    font-size: 22px;
    font-weight: 800;
    color: #17bcd4;
    line-height: 1.1;
    white-space: nowrap;
  }

  .chevron {
    font-size: 28px;
    color: #666;
    font-weight: 300;
    flex-shrink: 0;
    line-height: 1;
    margin: 0 2px;
    user-select: none;
  }

  .sep {
    width: 1px;
    height: 56px;
    background: #c8ccd2;
    margin: 0 20px;
    flex-shrink: 0;
  }

  .occupancy { flex-shrink: 0; }

  .occ-title {
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #333;
    text-transform: uppercase;
    margin-bottom: 9px;
  }

  .occ-boxes { display: flex; gap: 7px; }

  .occ-box {
    background: #e2e5e9;
    border-radius: 7px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 11px;
  }

  .occ-controls { display: flex; align-items: center; gap: 5px; }

  .occ-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 19px;
    font-weight: 700;
    color: #17bcd4;
    line-height: 1;
    padding: 0;
    width: 18px;
    text-align: center;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .occ-btn:hover { color: #0fa3b8; }

  .occ-num {
    font-size: 15px;
    font-weight: 700;
    color: #222;
    min-width: 16px;
    text-align: center;
  }

  .promo { flex: 1 1 0; min-width: 0; margin: 0 24px; }
  .promo input {
    width: 100%;
    border: none;
    border-bottom: 1.5px solid #b8bdc6;
    outline: none;
    background: transparent;
    font-size: 6px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #aaa;
    padding: 7px 0;
    font-family: inherit;
    font-weight: 600;
  }
  .promo input::placeholder { color: #bec2ca; font-size: xx-small; }
  .promo input:focus { border-bottom-color: #17bcd4; color: #555; }

  .book-btn {
    background: #1c3a6e;
    color: #fff;
    border: none;
    border-radius: 40%;
    width: 96px;
    height: 84px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.15s;
  }
  .book-btn:hover { background: #142d58; transform: scale(1.05); }
  .book-btn:active { transform: scale(0.97); }

  /* ─── Calendar: fixed to viewport, escapes ALL parent overflow/clipping ─── */
  .cal-wrap {
    position: fixed;
    z-index: 99999;
    display: none;
  }
  .cal-wrap.visible { display: block; }

  .cal-box {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.08);
    padding: 20px;
    width: 296px;
    animation: calPop 0.16s ease;
  }
  @keyframes calPop {
    from { opacity: 0; transform: translateY(-6px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .cal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-arrow {
    background: none;
    border: 1.5px solid #e0e4ea;
    border-radius: 8px;
    cursor: pointer;
    font-size: 17px;
    color: #17bcd4;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s;
    line-height: 1;
  }
  .cal-arrow:hover { background: rgba(23,188,212,0.1); }

  .cal-month-label {
    font-size: 13px;
    font-weight: 800;
    color: #1c3a6e;
    letter-spacing: 0.4px;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }

  .cal-dow {
    text-align: center;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.8px;
    color: #b0b5be;
    text-transform: uppercase;
    padding: 2px 0 8px;
  }

  .cal-cell {
    text-align: center;
    padding: 7px 0;
    font-size: 12.5px;
    font-weight: 600;
    color: #333;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
    line-height: 1;
  }
  .cal-cell:hover:not(.cal-empty):not(.cal-disabled) {
    background: rgba(23,188,212,0.18);
    color: #17bcd4;
  }
  .cal-cell.cal-empty    { cursor: default; }
  .cal-cell.cal-disabled { color: #d4d8de; cursor: not-allowed; }
  .cal-cell.cal-today    { color: #0fa3b8; font-weight: 900; }

  .cal-cell.cal-sel-start,
  .cal-cell.cal-sel-end  { background: #17bcd4 !important; color: #fff !important; border-radius: 7px; }
  .cal-cell.cal-sel-start { border-radius: 7px 0 0 7px; }
  .cal-cell.cal-sel-end   { border-radius: 0 7px 7px 0; }
  .cal-cell.cal-sel-start.cal-sel-end { border-radius: 7px; }
  .cal-cell.cal-in-range  { background: rgba(23,188,212,0.13); border-radius: 0; color: #1c3a6e; }

  .cal-hint {
    margin-top: 12px;
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    color: #17bcd4;
    letter-spacing: 0.3px;
    opacity: 0.75;
  }

  @media (max-width: 800px) {
    .dp-day{
          font-size: 14px;

    }
    .date-pill{
    padding: 8px 6px;

    }
    .widget {
      border-radius: 24px;
      flex-wrap: wrap;
      padding: 20px 18px;
      gap: 18px;
    }
    .dates-section { width: 100%; justify-content: center; }
    .sep { display: none; }
    .occupancy { width: 100%; }
    .promo { margin: 0; width: 100%; }
    .book-btn { width: 100%; height: 52px; border-radius: 999px; font-size: 14px; }
  }
</style>
</head>
<body>

<div class="widget">
  <div class="dates-section">
    <div class="date-pill" id="pill-checkin" onclick="toggleCal('checkin')">
      <span class="dp-label">Check-In</span>
      <span class="dp-month" id="ci-month">FEB</span>
      <span class="dp-day"  id="ci-day">26 2026</span>
    </div>

    <span class="chevron">&#8250;</span>

    <div class="date-pill" id="pill-checkout" onclick="toggleCal('checkout')">
      <span class="dp-label">Check-Out</span>
      <span class="dp-month" id="co-month">FEB</span>
      <span class="dp-day"  id="co-day">27 2026</span>
    </div>
  </div>

  <div class="sep"></div>

  <div class="occupancy">
    <div class="occ-title">Occupancy</div>
    <div class="occ-boxes">
      <div class="occ-box">
        <svg width="22" height="24" viewBox="0 0 22 24" fill="none">
          <circle cx="11" cy="5.5" r="4.5" fill="#17bcd4"/>
          <path d="M2 23c0-4.97 4.03-9 9-9s9 4.03 9 9" fill="#17bcd4"/>
        </svg>
        <div class="occ-controls">
          <button class="occ-btn" onclick="occ('adults',-1)">−</button>
          <span class="occ-num" id="adults-val">2</span>
          <button class="occ-btn" onclick="occ('adults',1)">+</button>
        </div>
      </div>
      <div class="occ-box">
        <svg width="22" height="24" viewBox="0 0 22 24" fill="none">
          <circle cx="11" cy="5" r="3.5" fill="#17bcd4"/>
          <rect x="9.5" y="9.5" width="3" height="7" rx="1.5" fill="#17bcd4"/>
          <path d="M9.5 11.5 L4 13" stroke="#17bcd4" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M12.5 11.5 L18 13" stroke="#17bcd4" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M10 16.5 L7.5 22" stroke="#17bcd4" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M12 16.5 L14.5 22" stroke="#17bcd4" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <div class="occ-controls">
          <button class="occ-btn" onclick="occ('children',-1)">−</button>
          <span class="occ-num" id="children-val">0</span>
          <button class="occ-btn" onclick="occ('children',1)">+</button>
        </div>
      </div>
    </div>
  </div>

  <div class="sep"></div>

  <div class="promo">
    <input type="text" id="promo" placeholder="Promotional Code" maxlength="30"/>
  </div>

  <button class="book-btn" onclick="book()">BOOK</button>
</div>

<!-- ✅ cal-wrap is now a direct child of <body> — zero clipping risk -->
<div class="cal-wrap" id="cal-wrap">
  <div class="cal-box">
    <div class="cal-head">
      <button class="cal-arrow" onclick="calShift(-1); event.stopPropagation();">&#8249;</button>
      <span class="cal-month-label" id="cal-label"></span>
      <button class="cal-arrow" onclick="calShift(1); event.stopPropagation();">&#8250;</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-hint" id="cal-hint"></div>
  </div>
</div>

<script>
(function () {
  const MONTHS     = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const MONTH_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DOW        = ['Su','Mo','Tu','We','Th','Fr','Sa'];

  function pad(n) { return String(n).padStart(2,'0'); }
  function fmt(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  function same(a,b) {
    return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }

  const today = new Date(); today.setHours(0,0,0,0);
  let ciDate  = new Date(today);
  let coDate  = new Date(today); coDate.setDate(today.getDate()+1);
  let mode    = null;
  let calY, calM;
  const counts = { adults:2, children:0 };

  const wrap  = document.getElementById('cal-wrap');
  const grid  = document.getElementById('cal-grid');
  const label = document.getElementById('cal-label');
  const hint  = document.getElementById('cal-hint');

  const CAL_W = 296;
  const GAP   = 10;

  function renderPills() {
    document.getElementById('ci-month').textContent = MONTHS[ciDate.getMonth()];
    document.getElementById('ci-day').textContent   = ciDate.getDate()+' '+ciDate.getFullYear();
    document.getElementById('co-month').textContent = MONTHS[coDate.getMonth()];
    document.getElementById('co-day').textContent   = coDate.getDate()+' '+coDate.getFullYear();
  }
  renderPills();

  /* Position the fixed calendar directly below the given pill element */
  function positionCal(pillEl) {
    const r  = pillEl.getBoundingClientRect();
    const vw = window.innerWidth;

    let top  = r.bottom + GAP;
    let left = r.left;

    // Keep within viewport horizontally
    if (left + CAL_W > vw - 8) left = vw - CAL_W - 8;
    if (left < 8) left = 8;

    wrap.style.top  = top  + 'px';
    wrap.style.left = left + 'px';
  }

  window.toggleCal = function(m) {
    if (mode === m && wrap.classList.contains('visible')) {
      closeCal(); return;
    }
    mode = m;
    calY = (m==='checkin' ? ciDate : coDate).getFullYear();
    calM = (m==='checkin' ? ciDate : coDate).getMonth();

    positionCal(document.getElementById('pill-'+m));
    document.getElementById('pill-checkin').classList.toggle('open',  m==='checkin');
    document.getElementById('pill-checkout').classList.toggle('open', m==='checkout');
    drawCal();
    wrap.classList.add('visible');
  };

  function closeCal() {
    mode = null;
    wrap.classList.remove('visible');
    document.getElementById('pill-checkin').classList.remove('open');
    document.getElementById('pill-checkout').classList.remove('open');
  }

  window.calShift = function(delta) {
    calM += delta;
    if (calM > 11) { calM=0; calY++; }
    if (calM < 0)  { calM=11; calY--; }
    drawCal();
  };

  function drawCal() {
    label.textContent = MONTH_FULL[calM] + ' ' + calY;
    grid.innerHTML = '';

    DOW.forEach(d => {
      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      grid.appendChild(el);
    });

    const firstDay = new Date(calY, calM, 1).getDay();
    const daysInM  = new Date(calY, calM+1, 0).getDate();

    for (let i=0; i<firstDay; i++) {
      const el = document.createElement('div');
      el.className = 'cal-cell cal-empty';
      grid.appendChild(el);
    }

    for (let d=1; d<=daysInM; d++) {
      const date = new Date(calY, calM, d);
      const el   = document.createElement('div');
      el.className = 'cal-cell';
      el.textContent = d;

      if (mode==='checkin' && date < today) {
        el.classList.add('cal-disabled');
      } else if (mode==='checkout') {
        const minCo = new Date(ciDate); minCo.setDate(ciDate.getDate()+1);
        if (date < minCo) el.classList.add('cal-disabled');
      }

      if (same(date, today)) el.classList.add('cal-today');

      const ci = new Date(ciDate); ci.setHours(0,0,0,0);
      const co = new Date(coDate); co.setHours(0,0,0,0);
      const dt = new Date(date);   dt.setHours(0,0,0,0);

      if (same(dt,ci) && same(dt,co)) {
        el.classList.add('cal-sel-start','cal-sel-end');
      } else if (same(dt,ci)) {
        el.classList.add('cal-sel-start');
      } else if (same(dt,co)) {
        el.classList.add('cal-sel-end');
      } else if (dt>ci && dt<co) {
        el.classList.add('cal-in-range');
      }

      if (!el.classList.contains('cal-disabled')) {
        el.addEventListener('click', function(e) {
          e.stopPropagation();
          pickDate(new Date(calY, calM, d));
        });
      }
      grid.appendChild(el);
    }

    hint.textContent = mode==='checkin'
      ? '▸ Select your check-in date'
      : '▸ Select your check-out date';
  }

  function pickDate(date) {
    if (mode === 'checkin') {
      ciDate = date;
      if (coDate <= ciDate) {
        coDate = new Date(ciDate);
        coDate.setDate(ciDate.getDate()+1);
      }
      renderPills();
      mode = 'checkout';
      calY = coDate.getFullYear();
      calM = coDate.getMonth();
      positionCal(document.getElementById('pill-checkout'));
      document.getElementById('pill-checkin').classList.remove('open');
      document.getElementById('pill-checkout').classList.add('open');
      drawCal();
    } else {
      coDate = date;
      renderPills();
      closeCal();
    }
  }

  // Keep calendar glued to pill on scroll / resize
  window.addEventListener('scroll', function() {
    if (mode && wrap.classList.contains('visible')) {
      positionCal(document.getElementById('pill-'+mode));
    }
  }, true);

  window.addEventListener('resize', function() {
    if (mode && wrap.classList.contains('visible')) {
      positionCal(document.getElementById('pill-'+mode));
    }
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.cal-wrap') && !e.target.closest('.date-pill')) {
      closeCal();
    }
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeCal();
  });

  window.occ = function(type, delta) {
    counts[type] += delta;
    if (type==='adults' && counts[type]<1) counts[type]=1;
    if (counts[type]<0) counts[type]=0;
    document.getElementById(type+'-val').textContent = counts[type];
  };

  window.book = function() {
    const promo = document.getElementById('promo').value.trim().toUpperCase();
    let url = `https://bookings.revchilltech.com/Rooms/?code=F673P2`
            + `&checkin=${fmt(ciDate)}`
            + `&checkout=${fmt(coDate)}`
            + `&adults=${counts.adults}`
            + `&children=${counts.children}`
            + `&rooms=1`;
    if (promo) url += `&promoCode=${encodeURIComponent(promo)}`;
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };
})();
</script>
</body>
</html>
